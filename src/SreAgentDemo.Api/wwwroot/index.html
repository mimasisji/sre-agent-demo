<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRE Agent Demo — Health Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 16px;
    }

    /* ── Traffic Light ── */
    .traffic-light-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .traffic-light {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #2d3748;
      border: 3px solid transparent;
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }

    .traffic-light.green {
      background: #22c55e;
      border-color: #16a34a;
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.5);
    }

    .traffic-light.yellow {
      background: #eab308;
      border-color: #ca8a04;
      box-shadow: 0 0 24px rgba(234, 179, 8, 0.5);
    }

    .traffic-light.red {
      background: #ef4444;
      border-color: #dc2626;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.5);
    }

    .status-text {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status-text.green { color: #22c55e; }
    .status-text.yellow { color: #eab308; }
    .status-text.red { color: #ef4444; }

    .status-sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    /* ── Latency Badge ── */
    .latency-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      background: #2d3748;
      transition: background 0.4s, color 0.4s;
    }

    .latency-badge.fast { background: #14532d; color: #4ade80; }
    .latency-badge.slow { background: #422006; color: #fb923c; }
    .latency-badge.degraded { background: #450a0a; color: #f87171; }

    /* ── Feature Flag Badges ── */
    .flag-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flag-badge {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1.5px solid transparent;
      transition: all 0.3s;
    }

    .flag-badge.off {
      background: #1a2535;
      border-color: #2d3748;
      color: #475569;
    }

    .flag-badge.on {
      background: #450a0a;
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) { background: #ef4444; }

    .btn-safe {
      background: #16a34a;
      color: #fff;
    }

    .btn-safe:hover:not(:disabled) { background: #22c55e; }

    .btn-neutral {
      background: #2d3748;
      color: #94a3b8;
    }

    .btn-neutral:hover:not(:disabled) { background: #374151; }

    /* ── Token input ── */
    .token-row {
      display: flex;
      gap: 8px;
    }

    .token-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 8px 12px;
      outline: none;
    }

    .token-input:focus { border-color: #4f46e5; }

    /* ── Footer ── */
    .footer {
      font-size: 0.75rem;
      color: #374151;
      margin-top: 12px;
    }

    .pulse {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <h1>Azure SRE Agent Demo</h1>

  <!-- Health Status -->
  <div class="card">
    <div class="card-title">Service Health</div>
    <div class="traffic-light-wrap">
      <div class="traffic-light" id="light"></div>
      <div>
        <div class="status-text" id="status-text">Checking...</div>
        <div class="status-sub" id="status-sub">Polling /health every 5s</div>
      </div>
    </div>
  </div>

  <!-- Latency -->
  <div class="card">
    <div class="card-title">Response Latency</div>
    <div class="latency-badge" id="latency-badge">—</div>
  </div>

  <!-- Feature Flags -->
  <div class="card">
    <div class="card-title">Active Feature Flags</div>
    <div class="flag-row">
      <span class="flag-badge off" id="flag-failure">FAILURE MODE: OFF</span>
      <span class="flag-badge off" id="flag-db">DB TIMEOUT: OFF</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="card-title">Demo Controls</div>

    <div class="card-title" style="margin-top:0; margin-bottom: 8px;">Admin Token</div>
    <div class="token-row" style="margin-bottom: 16px;">
      <input type="password" class="token-input" id="token-input" placeholder="Paste ADMIN_TOKEN here" />
      <button class="btn btn-neutral" onclick="saveToken()" style="min-width:80px; flex:unset;">Save</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-danger" id="btn-enable-failure" onclick="toggleFlag('failure-mode', true)">
        Enable Failure Mode
      </button>
      <button class="btn btn-safe" id="btn-disable-failure" onclick="toggleFlag('failure-mode', false)">
        Disable Failure Mode
      </button>
    </div>

    <div class="btn-row" style="margin-top: 10px;">
      <button class="btn btn-danger" id="btn-enable-db" onclick="toggleFlag('db-timeout', true)">
        Enable DB Timeout
      </button>
      <button class="btn btn-safe" id="btn-disable-db" onclick="toggleFlag('db-timeout', false)">
        Disable DB Timeout
      </button>
    </div>
  </div>

  <div class="footer">
    <span class="pulse"></span>
    Version: <span id="version">—</span> &nbsp;|&nbsp;
    <span id="last-poll">Last poll: —</span>
  </div>

  <script>
    // ── Token management (in-memory only, never localStorage) ──────────────
    let adminToken = '';

    function saveToken() {
      adminToken = document.getElementById('token-input').value.trim();
      document.getElementById('token-input').value = '';
      document.getElementById('token-input').placeholder = adminToken ? '● Token saved' : 'Paste ADMIN_TOKEN here';
    }

    // ── Flag toggle ─────────────────────────────────────────────────────────
    async function toggleFlag(flag, enabled) {
      if (!adminToken) {
        alert('Paste and save your ADMIN_TOKEN first.');
        return;
      }
      try {
        const res = await fetch(`/admin/${flag}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': adminToken
          },
          body: JSON.stringify({ enabled })
        });
        if (res.status === 401) { alert('Invalid token.'); return; }
        if (!res.ok) { alert(`Error: ${res.status}`); return; }
        await pollHealth(); // refresh immediately
      } catch (e) {
        alert('Request failed: ' + e.message);
      }
    }

    // ── Health polling ──────────────────────────────────────────────────────
    async function pollHealth() {
      const light = document.getElementById('light');
      const statusText = document.getElementById('status-text');
      const statusSub = document.getElementById('status-sub');
      const latencyBadge = document.getElementById('latency-badge');
      const flagFailure = document.getElementById('flag-failure');
      const flagDb = document.getElementById('flag-db');
      const versionEl = document.getElementById('version');
      const lastPollEl = document.getElementById('last-poll');

      const t0 = performance.now();
      try {
        const res = await fetch('/health');
        const latencyMs = Math.round(performance.now() - t0);
        const data = await res.json();

        // Version
        versionEl.textContent = (data.version ?? 'unknown').substring(0, 8);
        lastPollEl.textContent = `Last poll: ${new Date().toLocaleTimeString()}`;

        // Latency indicator (qualitative only — no numbers shown)
        const latencyClass = latencyMs < 500 ? 'fast' : latencyMs < 2000 ? 'slow' : 'degraded';
        const latencyLabel = latencyMs < 500 ? '⚡ Fast' : latencyMs < 2000 ? '⏳ Slow' : '🔴 Degraded';
        latencyBadge.className = `latency-badge ${latencyClass}`;
        latencyBadge.textContent = latencyLabel;

        // Feature flags
        const failureOn = data.flags?.failureMode === true;
        const dbOn = data.flags?.dbTimeout === true;

        flagFailure.textContent = `FAILURE MODE: ${failureOn ? 'ON' : 'OFF'}`;
        flagFailure.className = `flag-badge ${failureOn ? 'on' : 'off'}`;

        flagDb.textContent = `DB TIMEOUT: ${dbOn ? 'ON' : 'OFF'}`;
        flagDb.className = `flag-badge ${dbOn ? 'on' : 'off'}`;

        // Traffic light — red if any flag is on, yellow if latency slow
        if (failureOn || dbOn) {
          light.className = 'traffic-light red';
          statusText.className = 'status-text red';
          statusText.textContent = 'Degraded';
          statusSub.textContent = failureOn ? 'Failure mode is active' : 'DB timeout mode is active';
        } else if (latencyClass === 'slow') {
          light.className = 'traffic-light yellow';
          statusText.className = 'status-text yellow';
          statusText.textContent = 'Warning';
          statusSub.textContent = 'Elevated latency detected';
        } else {
          light.className = 'traffic-light green';
          statusText.className = 'status-text green';
          statusText.textContent = 'Healthy';
          statusSub.textContent = 'All systems nominal';
        }

      } catch {
        light.className = 'traffic-light red';
        statusText.className = 'status-text red';
        statusText.textContent = 'Unreachable';
        statusSub.textContent = 'Cannot reach /health';
        latencyBadge.className = 'latency-badge degraded';
        latencyBadge.textContent = '🔴 Degraded';
        lastPollEl.textContent = `Last poll: ${new Date().toLocaleTimeString()} (failed)`;
      }
    }

    // Start polling
    pollHealth();
    setInterval(pollHealth, 5000);
  </script>
</body>
</html>
